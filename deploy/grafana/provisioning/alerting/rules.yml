apiVersion: 1

groups:
  - orgId: 1
    name: maintenance-api
    folder: Maintenance
    interval: 1m

    rules:
      - uid: maintenance-api-5xx
        title: High 5xx response rate
        condition: B

        data:
          - refId: A
            datasourceUid: prometheus

            relativeTimeRange:
              from: 300
              to: 0

            model:
              editorMode: code
              expr: sum(rate(http_requests_total{status_code=~"5.."}[5m]))
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A

          - refId: B
            datasourceUid: __expr__

            relativeTimeRange:
              from: 0
              to: 0

            model:
              conditions:
                - evaluator:
                    params:
                      - 0.1
                    type: gt

                  operator:
                    type: and

                  query:
                    params:
                      - B

                  reducer:
                    params: []
                    type: last

                  type: query

              datasource:
                type: __expr__
                uid: __expr__

              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold

        for: 1m

        noDataState: NoData
        execErrState: Error

        annotations:
          summary: "Рост количества ответов 5xx"
          description: "Количество 5xx ответов превышает 0.1 запроса в секунду."

        labels:
          severity: warning